<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransitSense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; color: #38bdf8; }
  header span { font-size: 12px; color: #64748b; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
  .user { background: #2563eb; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
  .bot .meta { font-size: 11px; color: #64748b; margin-top: 8px; padding-top: 8px; border-top: 1px solid #334155; }
  .bot .provenance { color: #f59e0b; font-size: 11px; }
  .bot .skill { color: #38bdf8; }
  .loading { color: #64748b; font-style: italic; font-size: 13px; padding: 8px; }
  #input-row { display: flex; gap: 8px; padding: 16px 24px; background: #1e293b; border-top: 1px solid #334155; }
  #input-row input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
  #input-row input:focus { border-color: #38bdf8; }
  #input-row button { padding: 12px 24px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  #input-row button:hover { background: #1d4ed8; }
  #input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .welcome { text-align: center; color: #64748b; padding: 40px 20px; }
  .welcome h2 { color: #38bdf8; margin-bottom: 8px; }
  .welcome p { font-size: 14px; line-height: 1.6; }
  .welcome .examples { margin-top: 16px; font-size: 13px; color: #94a3b8; }
  .welcome .examples code { background: #1e293b; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .bot strong { color: #38bdf8; }
  .bot ul { margin: 6px 0; padding-left: 20px; }
  .bot li { margin: 4px 0; }
  .bot .locality-chip { display: inline-block; background: #334155; color: #e2e8f0; padding: 6px 14px; border-radius: 16px; margin: 4px 6px 4px 0; cursor: pointer; border: 1px solid #475569; font-size: 13px; }
  .bot .locality-chip:hover { background: #2563eb; border-color: #38bdf8; }
</style>
</head>
<body>
<header>
  <h1>TransitSense</h1>
  <span>AI Transit Decision Copilot</span>
</header>
<div id="chat">
  <div class="welcome">
    <h2>Ask about Hyderabad bus routes</h2>
    <p>Get delay analysis, forecasts, and route priority insights based on real TGSRTC data.</p>
    <div class="examples">
      Try:<br>
      <code>"what is the current status"</code><br>
      <code>"why is route 219 always late?"</code><br>
      <code>"how is Secunderabad doing?"</code><br>
      <code>"recommendations for route 219"</code>
    </div>
  </div>
</div>
<div id="input-row">
  <input type="text" id="input" placeholder="Ask about transit performance..." autofocus>
  <button id="send" onclick="send()">Send</button>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let sessionId = 'web-' + Date.now();

  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  function renderText(text) {
    if (!text) { const d = document.createElement('div'); d.textContent = ''; return d; }
    const div = document.createElement('div');
    div.style.lineHeight = '1.6';
    // Split by lines, handle bold, bullets, chips
    const lines = text.split('\n');
    let inUl = false;
    for (const line of lines) {
      const trimmed = line.trim();
      if (trimmed.startsWith('📍') || trimmed.startsWith('**')) {
        if (inUl) { const ul = div.lastElementChild; if (ul && ul.tagName === 'UL') inUl = false; }
        const p = document.createElement('div');
        p.innerHTML = trimmed
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/^📍/, '📍');
        div.appendChild(p);
      } else if (trimmed.startsWith('•') || trimmed.startsWith('-')) {
        if (!inUl) {
          inUl = true;
          const ul = document.createElement('ul');
          ul.id = 'active-ul';
          div.appendChild(ul);
        }
        const li = document.createElement('li');
        li.textContent = trimmed.replace(/^[•\-]\s*/, '');
        div.querySelector('#active-ul').appendChild(li);
      } else if (trimmed.startsWith('1.') || trimmed.startsWith('2.') || trimmed.startsWith('3.') || trimmed.startsWith('4.') || trimmed.startsWith('5.')) {
        if (inUl) { inUl = false; }
        const p = document.createElement('div');
        p.innerHTML = trimmed
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        div.appendChild(p);
      } else if (trimmed) {
        if (inUl) { inUl = false; }
        // Check for locality chips (lines with bullet-like options)
        if (trimmed.includes('  •') && trimmed.length < 40) {
          const chip = document.createElement('span');
          chip.className = 'locality-chip';
          chip.textContent = trimmed.replace('  • ', '');
          chip.onclick = () => { input.value = chip.textContent; send(); };
          div.appendChild(chip);
        } else {
          const p = document.createElement('div');
          p.innerHTML = trimmed
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          div.appendChild(p);
        }
      }
    }
    const activeUl = div.querySelector('#active-ul');
    if (activeUl) activeUl.removeAttribute('id');
    return div;
  }

  function addMessage(text, type, meta) {
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    const contentDiv = renderText(text);
    div.appendChild(contentDiv);
    if (meta) {
      const metaDiv = document.createElement('div');
      metaDiv.className = 'meta';
      if (meta.provenance) {
        const p = document.createElement('div');
        p.className = 'provenance';
        p.textContent = '⚠ ' + meta.provenance;
        metaDiv.appendChild(p);
      }
      const s = document.createElement('div');
      s.className = 'skill';
      s.textContent = 'skill: ' + meta.skill;
      metaDiv.appendChild(s);
      div.appendChild(metaDiv);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addLoading() {
    const div = document.createElement('div');
    div.className = 'loading';
    div.id = 'loading';
    div.textContent = 'Thinking...';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeLoading() {
    const el = document.getElementById('loading');
    if (el) el.remove();
  }

  async function send() {
    const query = input.value.trim();
    if (!query) return;
    addMessage(query, 'user');
    input.value = '';
    sendBtn.disabled = true;
    addLoading();
    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, session_id: sessionId })
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.detail || `Server returned ${res.status}`);
      }
      const data = await res.json();
      removeLoading();
      const meta = { skill: data.source_skill, provenance: data.data_provenance };
      addMessage(data.answer_text || "No response from server.", 'bot', meta);
    } catch (e) {
      removeLoading();
      addMessage('Error: ' + e.message + ' — server may need restart', 'bot');
    }
    sendBtn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
